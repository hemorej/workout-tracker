name: Qodana

# Advisory PR review (under evaluation): not a required check, and a failed
# scan doesn't fail the job.
on:
  pull_request:

concurrency:
  group: qodana-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qodana:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # summary comment
      checks: write # annotations
    steps:
      # PR head with full history, as Qodana's PR analysis requires.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.x"
          cache: pnpm

      # Gives the linter dependency types and the generated .nuxt types.
      - name: Install dependencies (frozen lockfile)
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      - name: Qodana scan
        id: scan
        continue-on-error: true
        uses: JetBrains/qodana-action@aa698739cd4b8204ad53291bea7e16cd75da3c9f # v2026.3.1
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}

      - name: Flag a scan that did not complete
        if: steps.scan.outcome == 'failure'
        run: echo "::warning::Qodana scan did not complete; see the scan step log."
